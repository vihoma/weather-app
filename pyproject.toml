[project]
name = "weather-app"
version = "0.7.22"
description = "A CLI weather app using OpenWeatherMap API, written in Python 3"
authors = [
    {name = "Lord Sohron",email = "29570082+vihoma@users.noreply.github.com"}
]
license = {text = "BSD 3-Clause"}
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyowm (>=3.5.0,<5.0.0)",
    "rich (>=15.0.0,<16.0.0)",
    "cachetools (>=7.1.7,<8.0.0)",
    "geopy (>=2.5.0,<3.0.0)",
    "setuptools (>=84.0.0, <86.0.0)",
    "aiohttp (>=3.14.3,<4.0.0)",
    "async-timeout (>=5.0.0,<6.0.0)",
    "keyring (>=25.7.0,<26.0.0)",
    "python-json-logger (>=4.2.0,<5.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "click (>=8.4.2,<10.0.0)",
    "logfire[aiohttp-client,system-metrics] (>=4.40.0,<6.0.0)"
]

[project.scripts]
# This is the main script entry point for the weather app
weather = "weather_app.main:main"

[dependency-groups]
dev = [
    "bandit (>=1.9.4,<2.0.0)",
    "pyrefly (>=1.4.0,<2.0.0)",
    "ruff (>=0.16.0,<0.17.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.2.0,<2.0.0)",
    "pytest-click (>=1.1.0,<2.0.0)",
    "pytest-mock (>=3.15.1,<4.0.0)",
    "types-PyYAML (>=6.0.0,<7.0.0)",
    "types-cachetools (>=7.0.0,<8.0.0)"
]

[tool.poetry]
packages = [
    {include = "weather_app", from = "src"}
]

[tool.logfire]
pydantic_plugin_record = "all"

[tool.mypy]
python_version = "3.13"
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "geopy.*",
    "pyowm.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "-p",
    "no:logfire",
    "--strict-markers",
    "--strict-config",
    "--tb=short"
]
markers = [
    "unit: Unit tests (fast, isolated)",
    "integration: Integration tests (slower, test interactions)",
    "functional: Functional tests (end-to-end)",
    "slow: Slow running tests",
    "api: Tests that require external API calls",
    "async: Async tests",
    "skip: Tests that should be skipped"
]

[tool.bandit]
test-targets = ["src/weather_app"]
skips = ["B101", "B110"]

[tool.pyrefly]
python-version = "3.13.0"
ignore-missing-imports = [
    "geopy.*",
    "pyowm.*",
]
project-includes = [
    "src/weather_app/**/*.py*",
    "src/weather_app/**/*.ipynb",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
